[package]
name = "fillforge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fillforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
fillforge-domain = { path = "../../../crates/fillforge-domain" }
fillforge-docx = { path = "../../../crates/fillforge-docx" }
indexmap.workspace = true
base64 = "0.22"
futures-util = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
ulid.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
